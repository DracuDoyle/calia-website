<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALIA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>



<body>


    <header>
        <nav>

            <div>
                <h1>DracuDoyle</h1>
            </div>

            <span class="nav-project-name">CALIA</span>

            <div class="nav-buttons">
                <button id="theme-toggle" aria-label="Theme">
                    <span id="theme-icon">☀</span>
                </button>
                <button id="lang-toggle" aria-label="Change language">
                    <span id="lang-icon">ES</span>
                </button>
            </div>

        </nav>
    </header>



    <main>


        <section id="hero">

            <div class="hero-content">
                <div class="hero-badge" data-i18n="hero_badge">In Development</div>
                <h2 class="hero-title">CALIA</h2>
                <p class="hero-acronym" data-i18n="hero_acronym">Communication, Autoregulation, Learning, Intelligent Adaptive system.</p>
                <p class="hero-tagline" data-i18n="hero_tagline">Designed for the way they think.</p>
            </div>

            <div class="hero-image">
                <img src="./assets/images/CALIA.jpg" alt="CALIA Logo" />
            </div>

        </section>


    </main>
    
    <script type="module" src="js/scripts.js"></script>


</body>

</html>
